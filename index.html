<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HNH Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<title>HNH Smart Field Map</title>
<style>
:root{--b:#0b3d6e;--b2:#1565c0;--b3:#e8f1fb;--r:#d62839;--r2:#fdecee;--bg:#f2f5f8;--ink:#14263a;--mut:#5d7183;--line:#d7e0e8;--ok:#1e8e3e;--warn:#c76a00;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{background:var(--b);color:#fff;padding:calc(var(--st) + 8px) 10px 8px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brandrow{display:flex;align-items:center;gap:8px}
.logo{display:flex;flex-direction:column;line-height:1.05;min-width:58px}
.logo b{font-size:17px;letter-spacing:.5px}.logo b i{font-style:normal;color:#ff6f7c}
.logo span{font-size:9.5px;color:#a9c4de;letter-spacing:.3px}
.sw{position:relative;flex:1;min-width:0}
#q{width:100%;height:46px;border-radius:12px;border:0;padding:0 14px;padding-inline-end:42px;background:#fff;color:var(--ink);outline:none}
#qx{position:absolute;inset-inline-end:4px;top:4px;width:38px;height:38px;border:0;background:none;font-size:18px;color:var(--mut);display:none}
.ib{width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;flex:none}
#results{position:absolute;top:52px;inset-inline:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:58vh;overflow:auto;display:none;z-index:30}
.res{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #eef2f5}
.res:last-child{border-bottom:0}
.res .ic{width:36px;height:34px;border-radius:10px;background:var(--b3);display:grid;place-items:center;font-size:16px;flex:none;font-weight:700;color:var(--b)}
.res .tx{flex:1;min-width:0}.res .tx b{display:block;font-size:14.5px;line-height:1.3}.res .badge{font-size:10px;padding:1px 6px;margin:2px 0 0}.res .tx small{color:var(--mut);font-size:12px}
.res .act{border:0;background:var(--r);color:#fff;border-radius:9px;padding:9px 11px;font-weight:700;font-size:13px;flex:none}
.res .act2{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:12px;flex:none}
.res.note{color:var(--mut);font-size:13px;display:block}
.row2{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.row2::-webkit-scrollbar{display:none}
.seg{display:flex;background:rgba(255,255,255,.13);border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:#cfe0f1;padding:7px 11px;border-radius:9px;font-weight:700;font-size:13.5px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--b)}
.chip{font-size:12px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap;flex:none;border:0;color:#fff}
.chip.good{background:#1e8e3e}.chip.mid{background:#c77700}.chip.bad{background:var(--r)}.chip.grey{background:#5b6b7a}
.chip.train{background:#7b2cbf}
#mapwrap{position:relative;flex:1;overflow:hidden;background:#dfe6ec;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;display:block}
.fabs{position:absolute;inset-inline-end:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:6}
.fab{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:19px;display:grid;place-items:center;padding:0}
.fab.on{background:var(--b);color:#fff;border-color:var(--b)}
.fab small{font-size:9px;display:block;line-height:1;margin-top:-2px}
#modeBanner{position:absolute;top:10px;inset-inline-start:10px;inset-inline-end:66px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:none;z-index:7;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#modeBanner span{flex:1}
#modeBanner button{border:0;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:700;font-size:13px}
#navTop{position:absolute;top:8px;inset-inline:8px;background:var(--b);color:#fff;border-radius:16px;padding:12px 14px;display:none;z-index:8;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#navTop .arrow{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:34px;flex:none}
#navTop .nt{flex:1;min-width:0}
#navTop .nd{font-size:26px;font-weight:800;line-height:1.1}
#navTop .ni{font-size:16px;font-weight:600;margin-top:2px}
#navTop .nw{font-size:12px;color:#ffd38a;margin-top:4px}
#card{position:absolute;bottom:8px;inset-inline:8px;background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.2);padding:12px 14px;z-index:9;display:none;max-height:46vh;overflow:auto}
#card h3{margin:0 0 4px;font-size:16px}
#card .sub{color:var(--mut);font-size:13px}
#card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px}
.btn.p{background:var(--b);border-color:var(--b);color:#fff}
.btn.r{background:var(--r);border-color:var(--r);color:#fff}
.btn.s{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.xbtn{position:absolute;inset-inline-end:8px;top:8px;border:0;background:#eef2f5;width:30px;height:30px;border-radius:50%;font-size:14px}
.stats{display:flex;gap:8px;margin-top:8px}
.stats div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px}
.stats small{display:block;color:var(--mut);font-size:11.5px}.stats b{font-size:19px}
.warnbox{background:#fff4e2;border:1px solid #f2cf95;color:#7a4a00;border-radius:11px;padding:8px 10px;font-size:12.5px;margin-top:8px;line-height:1.55}
.errbox{background:var(--r2);border:1px solid #f3b6bd;color:#8c1020;border-radius:11px;padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.55}
.okbox{background:#e8f6ec;border:1px solid #b7e0c3;color:#165c2a;border-radius:11px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;vertical-align:middle;margin-inline-start:4px}
.badge.ok{background:#e1f4e7;color:#1b6b33}.badge.ap{background:#fff0d9;color:#8a5200}.badge.no{background:#fde4e7;color:#9b1325}
.bar{background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--sb));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:20}
.bb{min-height:62px;border-radius:15px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;line-height:1.15;text-align:center}
.bb .i{font-size:21px;line-height:1}
.bb.me{border-color:#b9d3ee;color:var(--b)}
.bb.dest{border-color:#f1b9c0;color:var(--r)}
.bb.go{background:var(--r);color:#fff;border-color:var(--r);box-shadow:0 3px 10px rgba(214,40,57,.35)}
.bb.end{background:var(--ink);color:#fff;border-color:var(--ink)}
.bb:disabled{opacity:.38;box-shadow:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sb));background:rgba(20,38,58,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92vw;text-align:center;display:none;line-height:1.5}
.back{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:40;display:none}
.sheet{position:fixed;inset-inline:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:50;max-height:88vh;overflow:auto;padding:14px 16px calc(18px + var(--sb));display:none;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:700px){.sheet{inset-inline:auto;left:50%;transform:translateX(-50%);width:640px}}
.sheet h2{font-size:18px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.sheet h2 .xbtn{position:static;margin-inline-start:auto}
.sheet h4{margin:16px 0 6px;font-size:14px;color:var(--b)}
.menu button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:13px 4px;font-size:16px;font-weight:600;border-bottom:1px solid #eef2f5;text-align:start}
.menu button span{font-size:20px;width:28px;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.list .it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.list .it b{font-size:15px}
.list .it .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.frm label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.frm input[type=text],.frm input[type=number],.frm select,.frm textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.frm textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;direction:ltr}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;border-bottom:1px solid #f0f3f6}
.chk input{width:22px;height:22px}
.rd{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eef2f5;font-size:14px;line-height:1.55}
.rd .s{font-size:18px;width:26px;flex:none;text-align:center}
.rd small{color:var(--mut)}
.mut{color:var(--mut);font-size:13px;line-height:1.6}
#admBar{position:absolute;bottom:8px;inset-inline:8px;background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:8px;display:none;z-index:9;gap:6px;flex-wrap:wrap;align-items:center}
#admBar .lbl{font-size:12.5px;color:var(--mut);flex-basis:100%;padding:0 4px 4px}
.ltr{direction:ltr;unicode-bidi:embed}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brandrow">
      <div class="logo"><b>HNH <i>✚</i></b><span>Smart Field Map</span></div>
      <div class="sw">
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="searchPh" placeholder="">
        <button id="qx" aria-label="clear">✕</button>
        <div id="results"></div>
      </div>
      <button class="ib" id="menuBtn" aria-label="menu">☰</button>
    </div>
    <div class="row2">
      <div class="seg" id="modeSeg"><button data-m="cart" class="on" data-i18n="cart"></button><button data-m="walk" data-i18n="walk"></button></div>
      <button class="chip grey" id="gpsChip"></button>
      <span class="chip" id="netChip"></span>
      <span class="chip" id="calChip"></span>
      <span class="chip train" id="trainChip" style="display:none"></span>
    </div>
  </header>
  <main id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="world">
        <image id="baseImg" x="0" y="0" width="838" height="700" preserveAspectRatio="none"/>
        <g id="netL"></g>
        <g id="routeL"></g>
      </g>
      <g id="ov"></g>
    </svg>
    <div class="fabs">
      <button class="fab" id="fRecenter" aria-label="recenter">⌖</button>
      <button class="fab" id="fOrient" aria-label="orientation"><div><div id="orIcon">🕋</div><small id="orTxt"></small></div></button>
      <button class="fab" id="fIn" aria-label="zoom in">＋</button>
      <button class="fab" id="fOut" aria-label="zoom out">－</button>
      <button class="fab" id="fNet" aria-label="network">🕸</button>
      <button class="fab" id="fVoice" aria-label="voice" style="display:none">🔊</button>
    </div>
    <div id="modeBanner"><span id="mbTxt"></span><button id="mbAlt" style="display:none"></button><button id="mbCancel" data-i18n="cancel"></button></div>
    <div id="navTop"><div class="arrow" id="navArrow">↑</div><div class="nt"><div class="nd" id="navDist"></div><div class="ni" id="navInst"></div><div class="nw" id="navWarn"></div></div></div>
    <div id="card"></div>
    <div id="admBar"></div>
  </main>
  <nav class="bar">
    <button class="bb me" id="bMe"><span class="i">📍</span><span data-i18n="bMe"></span></button>
    <button class="bb dest" id="bDest"><span class="i">🔴</span><span data-i18n="bDest"></span></button>
    <button class="bb go" id="bGo" disabled><span class="i">🚑</span><span data-i18n="bGo"></span></button>
    <button class="bb end" id="bEnd" disabled><span class="i">■</span><span data-i18n="bEnd"></span></button>
  </nav>
</div>
<div class="back" id="back"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

/* ---------------- GPS ---------------- */
const gpsSubs=new Set();
function startGPS(){
  if(!('geolocation' in navigator)){gpsState='na';chips();toast(t('gpsNA'));return;}
  if(watchId!=null)return;gpsState='wait';chips();
  try{watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});}catch(e){onErr({code:0,message:String(e)});}
}
function onErr(e){if(e.code===1){gpsState='denied';watchId=null;
  toast(lang==='en'?'Location permission denied. Allow location for this site in browser settings (requires HTTPS hosting).':'تم رفض صلاحية الموقع. فعّلها للموقع من إعدادات المتصفح (تتطلب استضافة HTTPS). في آيفون: الإعدادات ← الخصوصية ← خدمات الموقع ← Safari.',6500);}
  else if(e.code===3){/* timeout: keep watching */}else{gpsState='na';}chips();}
function onPos(p){if(sim)return;ingest({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,heading:p.coords.heading,speed:p.coords.speed,t:p.timestamp||Date.now()});}
function ingest(f){
  const en=ll2en(f.lat,f.lon);let hd=null;
  let mv=false;if(f.heading!=null&&!isNaN(f.heading)&&(f.speed||0)>0.7){hd=f.heading;mv=true;}
  else if(gps&&dEN(gps.en,en)>4&&f.acc<25){hd=bearing(gps.en,en);mv=true;}
  else if(compassHd!=null)hd=compassHd;else if(gps)hd=gps.heading;
  gps={en,lat:f.lat,lon:f.lon,acc:f.acc,heading:hd,mv,t:f.t||Date.now(),pix:en2px(en.e,en.n)};gpsState='ok';
  gpsSubs.forEach(fn=>fn(gps));
  if(!manual){if(!(gps.pix.x>=0&&gps.pix.x<=W&&gps.pix.y>=0&&gps.pix.y<=H)){if(!outWarned){outWarned=true;toast(t('outMap'),5000);}}else outWarned=false;}
  chips();if(nav&&!manual)navUpdate(true);sched();
}
function avgGPS(sec){return new Promise((res,rej)=>{startGPS();const got=[];const fn=g=>{if(g.acc<=40)got.push(g);};gpsSubs.add(fn);
  setTimeout(()=>{gpsSubs.delete(fn);if(!got.length)return rej();let sw=0,la=0,lo=0;got.forEach(g=>{const w=1/Math.max(g.acc,1)**2;sw+=w;la+=g.lat*w;lo+=g.lon*w;});
    res({lat:la/sw,lon:lo/sw,acc:Math.min(...got.map(g=>g.acc)),n:got.length});},sec*1000);});}
function enableCompass(){const go=()=>{window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true);compassOn=true;toast('🧭 ✓');};
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go();else toast('🧭 ✕');}).catch(()=>toast('🧭 ✕'));}else go();}catch(e){toast('🧭 ✕');}}
function onOri(e){let h=null;if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;if(h==null)return;
  const so=(screen.orientation&&screen.orientation.angle)||0;compassHd=(h+so)%360;const m=me();if(m&&!m.manual&&!(m.mv&&Date.now()-m.t<4000)){m.heading=compassHd;sched();}}

/* ---------------- search & coordinate parsing ---------------- */
const toLat=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',');
const norm=s=>toLat(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function parseCoords(raw){
  const s=toLat(raw).trim();if(/maps\.app\.goo\.gl|goo\.gl\/maps|apple\.co\//i.test(s)&&!/\d+\.\d+\s*,\s*\d+\.\d+/.test(s))return{err:'short'};
  const dec=decodeURIComponent(s.replace(/\+/g,' '));
  const pats=[/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|ll|query|daddr|destination|sll|center)=(?:loc:)?\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/i,/geo:(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/i,/^\s*\(?\s*(-?\d{1,3}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)\s*\)?\s*$/];
  for(const re of pats){const m=dec.match(re);if(m)return fix(+m[1],+m[2]);}
  const dms=/(\d{1,3})\s*[°d:\s]\s*(\d{1,2})\s*['′m:\s]\s*(\d{1,2}(?:\.\d+)?)\s*["″s]?\s*([NSشج])?[\s,]+(\d{1,3})\s*[°d:\s]\s*(\d{1,2})\s*['′m:\s]\s*(\d{1,2}(?:\.\d+)?)\s*["″s]?\s*([EWقغ])?/i;
  const m=dec.match(dms);if(m){let a=+m[1]+m[2]/60+m[3]/3600,b=+m[5]+m[6]/60+m[7]/3600;if(/[Sج]/i.test(m[4]||''))a=-a;if(/[Wغ]/i.test(m[8]||''))b=-b;return fix(a,b);}
  const m2=dec.match(/(-?\d{1,3}\.\d{3,})\D+(-?\d{1,3}\.\d{3,})/);if(m2)return fix(+m2[1],+m2[2]);
  return null;
  function fix(a,b){if(Math.abs(a-39.6)<5&&Math.abs(b-24.5)<5)[a,b]=[b,a];if(Math.abs(a)>90||Math.abs(b)>180)return null;return{lat:a,lon:b};}
}
function destFromLL(ll,label){const en=ll2en(ll.lat,ll.lon);const px=en2px(en.e,en.n);
  if(px.x<0||px.y<0||px.x>W||px.y>H){const dx=Math.max(0,-px.x,px.x-W),dy=Math.max(0,-px.y,px.y-H);toast(t('outCov',{m:fmtD(Math.hypot(dx,dy)*mPerPx())}),6000);return false;}
  setDest(px,label||(lang==='en'?'Coordinates':'إحداثيات'),{en,outPlaza:!inPoly(px,PLAZA),fromCoords:true});centerOn(px,Math.max(cam.z,fitZ*2.2));return true;}
function search(q){
  const nq=norm(q);if(!nq)return[];const out=[];
  const c=parseCoords(q);if(c&&!c.err)out.push({kind:'coords',ll:c});else if(c&&c.err==='short')out.push({kind:'note',txt:t('shortLink')});
  const num=(nq.match(/^(?:بوابه|باب|بوابة|gate|g|رقم)?\s*#?\s*(\d{1,4})$/)||[])[1];
  const scored=[];for(const p of D.pois){let sc=0;const nm=norm(p.name.ar)+' '+norm(p.name.en||'')+' '+norm(p.num||'')+' '+norm((p.alias||[]).join(' '));
    if(num&&p.num===num)sc=100;else if(num&&p.num&&p.num.startsWith(num))sc=40;
    else{const words=nq.replace(/^ال/,'').split(' ').filter(w=>w.length>0);if(words.length&&words.every(w=>nm.includes(w.replace(/^ال/,''))))sc=30+(nm.startsWith(nq)?10:0);}
    if(sc)scored.push({sc,p});}
  scored.sort((a,b)=>b.sc-a.sc||(+a.p.num||0)-(+b.p.num||0));scored.slice(0,12).forEach(x=>out.push({kind:'poi',p:x.p}));
  if(num&&!scored.some(x=>x.sc===100))out.push({kind:'note',txt:lang==='en'?`Gate ${num} is not in the data yet — add it from Field data (or use the printed map).`:`البوابة ${num} غير مسجلة في البيانات بعد — يمكن إضافتها من «البيانات الميدانية».`});
  return out;
}

/* ---------------- routing ---------------- */
function allowed(e,md){if(e.status==='closed')return false;if(md==='cart')return e.cart&&!e.indoor;return e.walk&&(!e.indoor||S.indoorPermit);}
function projSeg(p,a,b){const dx=b.e-a.e,dy=b.n-a.n,L2=dx*dx+dy*dy;let t=L2?((p.e-a.e)*dx+(p.n-a.n)*dy)/L2:0;t=Math.max(0,Math.min(1,t));const q={e:a.e+t*dx,n:a.n+t*dy};return{t,q,d:dEN(p,q)};}
function computeRoute(from,to,md){
  const geo={};D.nodes.forEach(n=>geo[n.id]=geoOf(n));
  const E=D.edges.filter(e=>allowed(e,md)&&geo[e.a]&&geo[e.b]);if(!E.length)return{err:'nonet'};
  const snap=p=>{let best=null;for(const e of E){const r=projSeg(p,geo[e.a],geo[e.b]);if(!best||r.d<best.d)best={...r,e};}return best;};
  const s=snap(from),g=snap(to);const adj={};const add=(u,v,w,len,e)=>{(adj[u]=adj[u]||[]).push({v,w,len,e});};
  const cost=e=>(e.status==='draft'?1.2:1)*(e.crowd==='busy'?1.7:1);
  for(const e of E){const L_=dEN(geo[e.a],geo[e.b]);add(e.a,e.b,L_*cost(e),L_,e);add(e.b,e.a,L_*cost(e),L_,e);}
  geo.S=s.q;geo.T=g.q;
  const vlink=(id,sn)=>{const e=sn.e,L_=dEN(geo[e.a],geo[e.b]);add(id,e.a,sn.t*L_*cost(e),sn.t*L_,e);add(e.a,id,sn.t*L_*cost(e),sn.t*L_,e);add(id,e.b,(1-sn.t)*L_*cost(e),(1-sn.t)*L_,e);add(e.b,id,(1-sn.t)*L_*cost(e),(1-sn.t)*L_,e);};
  vlink('S',s);vlink('T',g);if(s.e===g.e){const L_=Math.abs(s.t-g.t)*dEN(geo[s.e.a],geo[s.e.b]);add('S','T',L_*cost(s.e),L_,s.e);}
  // Dijkstra
  const dist={S:0},prev={},done=new Set();const pq=[['S',0]];
  while(pq.length){let bi=0;for(let i=1;i<pq.length;i++)if(pq[i][1]<pq[bi][1])bi=i;const[u,du]=pq.splice(bi,1)[0];if(done.has(u))continue;done.add(u);if(u==='T')break;
    for(const x of adj[u]||[]){const nd=du+x.w;if(dist[x.v]==null||nd<dist[x.v]){dist[x.v]=nd;prev[x.v]={u,e:x.e,len:x.len};pq.push([x.v,nd]);}}}
  if(!done.has('T'))return{err:'noroute',snapS:s.d,snapT:g.d};
  const seq=[];let c='T';const es=[];while(c!=='S'){seq.unshift(c);es.unshift(prev[c]);c=prev[c].u;}seq.unshift('S');
  const pts=[from,...seq.map(id=>geo[id]),to];const nodesSeq=[null,...seq.map(id=>(id==='S'||id==='T')?null:nodeById(id)),null];
  let netLen=0,draft=0;const draftSegs=[];es.forEach((x,i)=>{netLen+=x.len;if(x.e.status==='draft'){draft+=x.len;draftSegs.push([geo[seq[i]],geo[seq[i+1]]]);}});
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+dEN(pts[i-1],pts[i]));
  const r={pts,nodesSeq,cum,total:cum[cum.length-1],netLen,draft,draftSegs,snapS:s.d,snapT:g.d,netIdx:[1,pts.length-2],mode:md,indoor:es.some(x=>x.e.indoor)};
  r.inst=buildInst(r);return r;
}
function nearLandmark(p){let best=null;for(const q of D.pois){if(!['gate','landmark','post','clinic','handover','ambulance'].includes(q.type))continue;if(q.type==='gate'&&!q.main)continue;const d=dEN(p,geoOf(q));if(d<22&&(!best||d<best.d))best={d,q};}return best&&best.q;}
function buildInst(r){const I=[];const P=r.pts;
  const b0=bearing(P[0],P[Math.min(2,P.length-1)]);const cd=CARD(lang)[Math.round(b0/45)%8];
  if(r.snapS>12)I.push({s:0,k:'start',txt:t('toNet',{m:fmtD(r.snapS)}),ar:'↗'});else I.push({s:0,k:'start',txt:t('startHead',{d:cd}),ar:'↑'});
  for(let i=1;i<P.length-1;i++){const segIn=r.cum[i]-r.cum[i-1],segOut=r.cum[i+1]-r.cum[i];if(segIn<2||segOut<2)continue;
    const tr=n180(bearing(P[i],P[i+1])-bearing(P[i-1],P[i]));const a=Math.abs(tr);if(a<28)continue;
    let k,ar;if(a>140){k='uturn';ar='⤺';}else if(a<60){k=tr>0?'slR':'slL';ar=tr>0?'↗':'↖';}else{k=tr>0?'turnR':'turnL';ar=tr>0?'↱':'↰';}
    if(lang==='ar'&&k!=='uturn')ar=tr>0?(a<60?'↗':'↱'):(a<60?'↖':'↰');
    const lm=r.nodesSeq[i]&&r.nodesSeq[i].name?L(r.nodesSeq[i].name):(nearLandmark(P[i])?L(nearLandmark(P[i]).name):null);
    let txt=t(k)+(lm?t('atLm',{n:lm}):'');if(i===P.length-2&&r.snapT>12)txt=t('lastLeg');
    I.push({s:r.cum[i],k,txt,ar});}
  I.push({s:r.total,k:'arrive',txt:t('near'),ar:'🏁'});return I;}

      <div class="acts">${S.mode==='cart'?`<button class="btn p" id="tw">${t('tryWalk')}</button>`:''}<button class="btn" id="cb">${lang==='en'?'Back':'رجوع'}</button></div>`);
    $('#cX').onclick=$('#cb').onclick=showDestCard;if($('#tw'))$('#tw').onclick=()=>{S.mode='walk';saveS();chips();startNav();};return;}
  route=r;nav=true;follow=true;offCount=0;lastSpoken='';hideRes();setMode(null);
  if(S.voice)try{speechSynthesis.cancel();}catch(e){}
  renderRoute();measure();if(!manual)cam.z=Math.max(cam.z,fitZ*3);chips();navUpdate(true);sched();
}
function endNav(keepDest){nav=false;route=null;follow=false;stopSim();renderRoute();$('#navTop').style.display='none';try{speechSynthesis.cancel();}catch(e){}chips();if(keepDest!==true)showDestCard();sched();}
function progress(p){const P=route.pts;let best={d:1e9,s:0,i:0};for(let i=1;i<P.length;i++){const r=projSeg(p,P[i-1],P[i]);if(r.d<best.d)best={d:r.d,s:route.cum[i-1]+r.t*(route.cum[i]-route.cum[i-1]),i};}return best;}
function navUpdate(fresh){
  if(!nav||!route)return;const m=me();if(!m)return;const pr=progress(m.en);const remain=Math.max(0,route.total-pr.s);
  const spd=(S.mode==='cart'?S.cartKmh:S.walkKmh)/3.6;
  // off-route handling (GPS only)
  if(fresh&&!m.manual){const tol=Math.max(20,(m.acc||0)*.8);
    if(pr.d>tol){offCount++;if(offCount>=3&&Date.now()-lastReroute>6000){if(m.acc<=25){lastReroute=Date.now();offCount=0;const r=computeRoute(m.en,dest.en,S.mode);if(!r.err){route=r;renderRoute();say(t('rerouted'));toast(t('rerouted'));return navUpdate(false);}}else{toast(t('offRouteWeak'),4000);lastReroute=Date.now();}}}else offCount=0;}
  const next=route.inst.find(x=>x.s>pr.s+6)||route.inst[route.inst.length-1];const toNext=Math.max(0,next.s-pr.s);
  const dToDest=dEN(m.en,dest.en);let arrow=next.ar,main=next.txt,big=fmtD(toNext);
  if(dToDest<12||remain<8){arrow='🏁';main=t('arrived');big='';}else if(remain<40){arrow='🏁';main=t('near');big=fmtD(remain);}
  else if(next.k==='arrive'){arrow='↑';main=t('goStraight')+(lang==='en'?' to the case location':' حتى موقع الحالة');big=fmtD(remain);}
  else if(toNext>60&&pr.s>5){main=t('goStraight')+' — '+t('in',{m:fmtD(toNext)})+': '+next.txt;arrow='↑';}
  $('#navArrow').textContent=arrow;$('#navDist').textContent=big;$('#navInst').textContent=main;
  const stale=!m.manual&&Date.now()-m.t>15000;
  $('#navWarn').textContent=m.manual?t('manualNote'):stale?t('staleNote',{s:Math.round((Date.now()-m.t)/1000)}):(pr.d>25&&!m.manual?t('offRoute'):'');
  $('#navTop').style.display='flex';
  // speech
  const key=main+'|'+(toNext<35?'n':'f');if(S.voice&&fresh&&key!==lastSpoken&&(toNext<35||main===t('near')||main===t('arrived')||lastSpoken==='')){lastSpoken=key;say(main);}
  const warn=[];if(route.draft>3)warn.push(t('draftWarn',{m:fmtD(route.draft)}));const ap=route.snapS+route.snapT;
  if(route.snapS>40)warn.push(t('farNet',{m:fmtD(route.snapS)}));else if(ap>15)warn.push(t('approachWarn',{m:fmtD(ap)}));if(route.indoor)warn.push(lang==='en'?'⚠️ Route enters the mosque — exceptional permit mode.':'⚠️ المسار يدخل المسجد — وضع التصريح الاستثنائي.');
  const modeName=S.mode==='cart'?t('cart'):t('walk');
  if(card(`<div class="stats"><div><small>${t('remain')}</small><b>${fmtD(remain)}</b></div><div><small>${t('eta')}</small><b>${fmtT(remain/spd)}</b></div><div><small>${t('via')}</small><b style="font-size:14px">${modeName}</b></div></div>
   <div class="sub" style="margin-top:6px">🔴 ${esc(dest.label)}</div>${warn.length?`<details class="warnbox" style="padding:6px 10px"><summary style="font-weight:700">⚠️ ${warn.length} ${lang==='en'?'route notes':'تنبيهات على المسار'} — ${lang==='en'?'tap':'اضغط للعرض'}</summary>${warn.map(w=>`<div style="margin-top:4px">${esc(w)}</div>`).join('')}</details>`:''}
   <div class="acts">${S.training?`<button class="btn p s" id="simB">${sim?t('simStop'):t('simulate')}</button>`:''}${m.manual?`<button class="btn s" id="rg">${t('resumeGPS')}</button>`:''}<button class="btn s" id="ov2">${lang==='en'?'Overview':'عرض المسار كاملًا'}</button></div>`)){
  if($('#simB'))$('#simB').onclick=()=>sim?stopSim():startSim();if($('#rg'))$('#rg').onclick=resumeGPS;$('#ov2').onclick=overview;}
  if(remain<8&&fresh)stopSim();
}
function overview(){if(!route)return;follow=false;const ps=route.pts.map(p=>en2px(p.e,p.n));const xs=ps.map(p=>p.x),ys=ps.map(p=>p.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  measure();cam.x=(x0+x1)/2;cam.y=(y0+y1)/2;cam.z=clampZ(Math.min(vw/((x1-x0)+60),vh/((y1-y0)+160)));chips();sched();}

function startSim(){if(!route)return;const spd=(S.mode==='cart'?S.cartKmh:S.walkKmh)/3.6*1.5;manual=null;let s=0;const P=route.pts;
  sim=setInterval(()=>{s+=spd*.5;if(s>=route.total){s=route.total;}let i=1;while(i<P.length-1&&route.cum[i]<s)i++;const f=(s-route.cum[i-1])/((route.cum[i]-route.cum[i-1])||1);
    const e=P[i-1].e+(P[i].e-P[i-1].e)*f,n=P[i-1].n+(P[i].n-P[i-1].n)*f;const ll=en2ll(e,n);ingest({lat:ll.lat,lon:ll.lon,acc:5,heading:bearing(P[i-1],P[i]),speed:spd,t:Date.now()});if(s>=route.total)stopSim();},500);navUpdate(false);}

const ptrs=new Map();let gStart=null,moved=false,lastTap=0;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.fabs,#card,#modeBanner,#navTop,#admBar'))return;wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(ptrs.size===1){if(gStart&&Math.hypot(cur.x-gStart.x,cur.y-gStart.y)>7)moved=true;if(moved){follow=false;panBy(cur.x-prev.x,cur.y-prev.y);}}
  else if(ptrs.size===2){const ids=[...ptrs.keys()];const o=ptrs.get(ids[0]===e.pointerId?ids[1]:ids[0]);const d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(cur.x-o.x,cur.y-o.y);
    const m0={x:(prev.x+o.x)/2-r.left,y:(prev.y+o.y)/2-r.top},m1={x:(cur.x+o.x)/2-r.left,y:(cur.y+o.y)/2-r.top};if(d0>0){zoomAt(m0.x,m0.y,d1/d0);}panBy(m1.x-m0.x,m1.y-m0.y);follow=false;}

const endP=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0&&!moved&&gStart&&Date.now()-gStart.t<600){const r=wrap.getBoundingClientRect();const sx=e.clientX-r.left,sy=e.clientY-r.top;
    const now=Date.now();if(now-lastTap<300&&!mode&&!admTool){zoomAt(sx,sy,1.8);lastTap=0;return;}lastTap=now;onTap(sx,sy);}
  if(ptrs.size===0){gStart=null;chips();}};

function hitPoi(sx,sy){let best=null;for(const p of D.pois){if(p.type==='gate'&&!p.main&&cam.z<fitZ*2.2)continue;if((p.type==='landmark'||p.type==='medical')&&!showLabels())continue;if(p.type==='plaza'||p.type==='zone')continue;const s=w2s(pixOf(p));const d=Math.hypot(s.x-sx,s.y-sy);if(d<20&&(!best||d<best.d))best={d,p};}return best&&best.p;}
function hitNode(sx,sy){let best=null;for(const n of D.nodes){const s=w2s(pixOf(n));const d=Math.hypot(s.x-sx,s.y-sy);if(d<18&&(!best||d<best.d))best={d,n};}return best&&best.n;}
function hitEdge(sx,sy){let best=null;for(const e of D.edges){const a=nodeById(e.a),b=nodeById(e.b);if(!a||!b)continue;const A=w2s(pixOf(a)),B=w2s(pixOf(b));const r=projSeg({e:sx,n:sy},{e:A.x,n:A.y},{e:B.x,n:B.y});if(r.d<14&&(!best||r.d<best.d))best={d:r.d,e};}return best&&best.e;}
function onTap(sx,sy){hideRes();const w=s2w(sx,sy);const inMap=w.x>=0&&w.y>=0&&w.x<=W&&w.y<=H;

  if(admTool==='cal'&&pendingCal){pendingCal={x:w.x,y:w.y};admBar();sched();return;}
  if(admTool==='poi'){const A=lang==='ar';const id='p'+Date.now().toString(36);const nm={gate:A?'بوابة جديدة':'New gate',post:A?'نقطة تمركز':'Post',clinic:A?'عيادة':'Clinic',handover:A?'نقطة تسليم':'Handover',ambulance:A?'موقف إسعاف':'Ambulance',landmark:A?'معلم':'Landmark'}[admPoiNew];
    D.pois.push({id,type:admPoiNew,name:{ar:nm,en:nm},x:w.x,y:w.y,approx:true,num:admPoiNew==='gate'?'':undefined,main:admPoiNew==='gate'});saveD();admTool=null;admBar();sched();poiEdit(id);return;}
  if(admTool==='poimove'){const p=D.pois.find(x=>x.id===admPoiMove);p.x=w.x;p.y=w.y;delete p.lat;delete p.lon;p.approx=true;saveD();admTool=null;admBar();sched();adminSheet('places');return;}
  if(admTool==='nodemove'){const n=nodeById(admSel.id);n.x=w.x;n.y=w.y;delete n.lat;delete n.lon;saveD();admTool='net';renderNet();admBar();sched();return;}
  if(admTool==='net'){const n=hitNode(sx,sy);
    if(netTool==='sel'){if(n){admSel={t:'n',id:n.id};}else{const e=hitEdge(sx,sy);admSel=e?{t:'e',id:e.id}:null;}renderNet();admBar();sched();return;}
    // draw tool
    if(n&&admAnchor===n.id){admAnchor=null;sched();return;}
    let target=n;if(!target){target={id:newNodeId(),x:w.x,y:w.y};D.nodes.push(target);}
    if(admAnchor&&admAnchor!==target.id&&!D.edges.some(e=>(e.a===admAnchor&&e.b===target.id)||(e.b===admAnchor&&e.a===target.id)))D.edges.push({id:'e'+Date.now().toString(36)+(nodeSeq++),a:admAnchor,b:target.id,cart:true,walk:true,indoor:false,status:'draft',crowd:'normal'});
    admAnchor=target.id;saveD();renderNet();chips();sched();}
}
function poiEdit(id){const p=D.pois.find(x=>x.id===id);const A=lang==='ar';
  openSheet(`<h2>✏️ ${esc(L(p.name))}<button class="xbtn" id="sx">✕</button></h2><div class="frm">
   <label>${A?'الاسم بالعربية':'Arabic name'}</label><input type="text" id="eAr" value="${esc(p.name.ar)}"><label>${A?'الاسم بالإنجليزية':'English name'}</label><input type="text" id="eEn" value="${esc(p.name.en||'')}">
   ${p.type==='gate'?`<label>${A?'رقم البوابة':'Gate number'}</label><input type="text" id="eNum" value="${esc(p.num||'')}" inputmode="numeric"><label class="chk"><input type="checkbox" id="eMain" ${p.main?'checked':''}>${A?'تظهر عند التصغير (بوابة رئيسية)':'Show at low zoom'}</label>`:''}
   <label>${A?'ملاحظة تشغيلية':'Operational note'}</label><input type="text" id="eNote" value="${esc(p.note||'')}">
   <label>${A?'أسماء بديلة للبحث (مفصولة بفاصلة)':'Search aliases (comma separated)'}</label><input type="text" id="eAl" value="${esc((p.alias||[]).join(', '))}">
   <div style="display:flex;gap:8px;margin-top:14px"><button class="btn p" id="eOk">${A?'حفظ':'Save'}</button><button class="btn" id="eDel" style="color:var(--r)">🗑</button></div></div>`);
  $('#sx').onclick=()=>adminSheet('places');
  $('#eOk').onclick=()=>{p.name={ar:$('#eAr').value.trim()||p.name.ar,en:$('#eEn').value.trim()};if($('#eNum')){p.num=$('#eNum').value.trim();p.main=$('#eMain').checked;}p.note=$('#eNote').value.trim();p.alias=$('#eAl').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);saveD();toast(t('saved'));sched();adminSheet('places');};
  $('#eDel').onclick=()=>{const b=$('#eDel');if(!b.dataset.c){b.dataset.c=1;b.textContent=A?'تأكيد الحذف':'Confirm';return;}D.pois=D.pois.filter(x=>x!==p);saveD();sched();adminSheet('places');};}

/* ---------------- server data, deep links, PWA ---------------- */
function loadServerData(){try{fetch('field-data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||j.schema!==1)return;
  if(j.version===D.version)return;
  if(!D.dirty&&j.version>D.version){D=j;D.dirty=false;D.baseVersion=j.version;saveD(false);rebuildModel();renderNet();chips();sched();toast(lang==='en'?'Latest field data loaded':'تم تحميل أحدث البيانات الميدانية');}
  else if(D.dirty&&j.version>D.baseVersion){card(`<button class="xbtn" id="cX">✕</button><h3>🔄 ${t('dataNewer')}</h3><div class="warnbox">${lang==='en'?'Loading it replaces your unpublished local edits.':'تحميلها يستبدل تعديلاتك المحلية غير المنشورة.'}</div><div class="acts"><button class="btn p" id="ad">${t('adopt')}</button></div>`);$('#cX').onclick=()=>card(null);$('#ad').onclick=()=>{D=j;D.dirty=false;D.baseVersion=j.version;saveD(false);rebuildModel();renderNet();chips();card(null);sched();};}
}).catch(()=>{});}catch(e){}}
function deepLink(){try{const u=new URLSearchParams(location.search);const raw=u.get('dest')||u.get('url')||u.get('text')||((u.get('lat')&&(u.get('lng')||u.get('lon')))?u.get('lat')+','+(u.get('lng')||u.get('lon')):null);
  if(!raw)return;const r=parseCoords(raw);if(r&&!r.err){setTimeout(()=>destFromLL(r,u.get('label')||u.get('title')||null),300);}else toast(r&&r.err?t('shortLink'):t('badCoords'),5000);
  try{history.replaceState(null,'',location.pathname);}catch(e){}}catch(e){}}
function registerSW(){try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast(t('update'),5000);});});}).catch(()=>{});}}catch(e){}}

/* ---------------- boot ---------------- */
lang=S.lang||'ar';applyI18n();measure();fitPlaza();renderNet();
new ResizeObserver(()=>{const oz=fitZ;measure();if(oz>0&&cam.z)cam.z=cam.z*(fitZ/oz);sched();}).observe(wrap);
window.addEventListener('online',chips);window.addEventListener('offline',chips);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chips();});
loadServerData();deepLink();registerSW();
try{if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state==='granted')startGPS();}).catch(()=>{});}catch(e){}
window.__hnh={get D(){return D},computeRoute,ingest,setDest,get route(){return route},get M(){return M},px2en,en2px,en2ll,parseCoords,search,startNav,setManualPix,get cam(){return cam},S};
})();
